[package]
name = "graphlite-node"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Node.js bindings for GraphLite embedded graph database"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
graphlite = { git = "https://github.com/GraphLite-AI/GraphLite.git", branch = "main" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
