name: Version

on:
  workflow_dispatch:
    inputs:
      runType:
        description: "Run type"
        required: true
        default: Dry run
        type: choice
        options:
          - Dry run
          - Live
      versionBump:
        description: "Version bump strategy"
        required: true
        default: prerelease
        type: choice
        options:
          - major
          - minor
          - patch
          - premajor
          - preminor
          - prepatch
          - prerelease
          - custom
      customVersion:
        description: "Custom version"
        type: string

jobs:
  Bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      - name: Bump version
        run: |
          VERSION_ARG="${{ inputs.versionBump == 'custom' && inputs.customVersion || inputs.versionBump }}"
          npm version "$VERSION_ARG" --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          ./node_modules/.bin/napi version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = pkg.version;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if [ "${{ inputs.runType }}" = "Live" ]; then
            git add -u
            git commit -m "v$NEW_VERSION"
            git tag -a "v$NEW_VERSION" -m "v$NEW_VERSION"
            git push --follow-tags
          else
            echo "Dry run — new version would be: $NEW_VERSION"
          fi
      - name: Create GitHub Release
        if: inputs.runType == 'Live'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
